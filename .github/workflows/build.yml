name: Windows kurulum dosyası

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: PerdeVitrini-Kurulum
          path: dist/*.exe
      - name: Sürüm numarası
        id: ver
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      - name: Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Perde Vitrini ${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          files: dist/*.exe
